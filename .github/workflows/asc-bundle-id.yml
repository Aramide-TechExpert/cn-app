# TEMP (Newsinfo rename): register the com.newsinfo.app bundle id (+ push
# capability) in the Apple Developer portal via the ASC API, so the App Store
# Connect app record "Newsinfo" can be created. Deleted after one run.
name: asc-bundle-id
on:
  workflow_dispatch: {}
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register bundle id + push capability
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node -e '
          const crypto = require("crypto");
          const key = Buffer.from(process.env.ASC_API_KEY_P8, "base64").toString("utf8");
          const b64 = o => Buffer.from(JSON.stringify(o)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const h = b64({ alg: "ES256", kid: process.env.ASC_KEY_ID, typ: "JWT" });
          const c = b64({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" });
          const sig = crypto.sign("sha256", Buffer.from(h + "." + c), { key, dsaEncoding: "ieee-p1363" }).toString("base64url");
          const H = { Authorization: "Bearer " + h + "." + c + "." + sig, "Content-Type": "application/json" };
          const api = "https://api.appstoreconnect.apple.com/v1";
          (async () => {
            // Idempotent: find or create the bundle id record.
            const list = await (await fetch(api + "/bundleIds?filter[identifier]=com.newsinfo.app&limit=5", { headers: H })).json();
            let rec = (list.data || []).find(d => d.attributes.identifier === "com.newsinfo.app");
            if (!rec) {
              const r = await fetch(api + "/bundleIds", {
                method: "POST", headers: H,
                body: JSON.stringify({ data: { type: "bundleIds", attributes: { identifier: "com.newsinfo.app", name: "Newsinfo", platform: "IOS" } } }),
              });
              const j = await r.json();
              if (!r.ok) { console.error("bundleId create failed:", r.status, JSON.stringify(j.errors)); process.exit(1); }
              rec = j.data;
              console.log("bundle id registered:", rec.id);
            } else console.log("bundle id already registered:", rec.id);
            const cap = await fetch(api + "/bundleIdCapabilities", {
              method: "POST", headers: H,
              body: JSON.stringify({ data: { type: "bundleIdCapabilities", attributes: { capabilityType: "PUSH_NOTIFICATIONS" },
                relationships: { bundleId: { data: { type: "bundleIds", id: rec.id } } } } }),
            });
            console.log("push capability:", cap.status, cap.ok ? "enabled" : JSON.stringify((await cap.json()).errors));
          })().catch(e => { console.error(e.message); process.exit(1); });
          '
