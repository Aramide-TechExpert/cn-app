# Build the iOS app on a cloud macOS runner (Xcode 16 + iOS 18 SDK natively —
# no local Ventura/Xcode-15.4 limits) and ship it to TestFlight. Manual trigger.
#
# REQUIRES (App Store Connect / Apple Developer — see docs):
#   - Paid Apple Developer Program membership ($99/yr) — TestFlight needs it.
#   - Bundle id com.clusternews.app registered (with Push Notifications capability)
#     + an App record in App Store Connect.
#   - An App Store Connect API key (Admin or App Manager role).
# GitHub repo secrets used:
#   ASC_KEY_ID       — the API key's Key ID
#   ASC_ISSUER_ID    — the API key's Issuer ID
#   ASC_API_KEY_P8   — base64 of the downloaded AuthKey_XXXX.p8
#   APPLE_TEAM_ID    — your 10-char Apple Developer Team ID
name: iOS TestFlight

on:
  workflow_dispatch: {}

jobs:
  testflight:
    runs-on: macos-26 # Xcode 26 + iOS 26 SDK (Apple's 2026 upload floor); builds what Ventura can't
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter deps
        run: flutter pub get

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ios/private_keys
          echo "$ASC_API_KEY_P8" | base64 --decode > "ios/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Absolute copy for xcodebuild's cloud-signing auth flags.
          echo "$ASC_API_KEY_P8" | base64 --decode > "$HOME/AuthKey_${ASC_KEY_ID}.p8"

      - name: Generate iOS config + CocoaPods
        # The dart-defines bake the runtime config (Supabase, API base, Google
        # sign-in ids) into Generated.xcconfig — without them the app ships
        # configless and crashes with LateInitializationError on 'client'.
        run: |
          flutter build ios --release --config-only --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE=${{ secrets.API_BASE || 'https://clustez-mu.vercel.app/api/v1' }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          cd ios && pod install --repo-update

      - name: Write fastlane config
        run: |
          mkdir -p ios/fastlane
          cat > ios/fastlane/Appfile <<'APPFILE'
          app_identifier("com.clusternews.app")
          APPFILE
          cat > ios/fastlane/Fastfile <<'FASTFILE'
          default_platform(:ios)
          platform :ios do
            lane :beta do
              key = app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_filepath: "private_keys/AuthKey_#{ENV['ASC_KEY_ID']}.p8",
              )
              # Use the CI run number as the build number (must be unique per upload).
              increment_build_number(
                build_number: ENV["GITHUB_RUN_NUMBER"],
                xcodeproj: "Runner.xcodeproj",
              )
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                # Cloud signing: CI has no logged-in Xcode account, so xcodebuild
                # must authenticate with the ASC API key itself.
                xcargs: "-allowProvisioningUpdates " \
                  "-authenticationKeyPath #{ENV['HOME']}/AuthKey_#{ENV['ASC_KEY_ID']}.p8 " \
                  "-authenticationKeyID #{ENV['ASC_KEY_ID']} " \
                  "-authenticationKeyIssuerID #{ENV['ASC_ISSUER_ID']} " \
                  "DEVELOPMENT_TEAM=#{ENV['APPLE_TEAM_ID']} CODE_SIGN_STYLE=Automatic",
                export_options: {
                  signingStyle: "automatic",
                  teamID: ENV["APPLE_TEAM_ID"],
                },
              )
              upload_to_testflight(
                api_key: key,
                skip_waiting_for_build_processing: true,
              )
            end
          end
          FASTFILE

      - name: Build + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # SwiftPM resolution makes -showBuildSettings slow; fastlane's base
          # timeout is 3s which times out before Firebase's packages resolve.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "300"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"
        run: |
          cd ios && fastlane beta
