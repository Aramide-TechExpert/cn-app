# TEMP: check whether the App Store Connect app record for com.newsloop.app
# exists yet (gates the TestFlight upload). Deleted after use.
name: asc-check
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query app record
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node -e '
          const crypto = require("crypto");
          const key = Buffer.from(process.env.ASC_API_KEY_P8, "base64").toString("utf8");
          const b64 = o => Buffer.from(JSON.stringify(o)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const h = b64({ alg: "ES256", kid: process.env.ASC_KEY_ID, typ: "JWT" });
          const c = b64({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" });
          const sig = crypto.sign("sha256", Buffer.from(h + "." + c), { key, dsaEncoding: "ieee-p1363" }).toString("base64url");
          const H = { Authorization: "Bearer " + h + "." + c + "." + sig };
          (async () => {
            const r = await fetch("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.newsloop.app&fields[apps]=name,bundleId", { headers: H });
            const j = await r.json();
            if ((j.data || []).length > 0) console.log("RECORD_EXISTS:", j.data[0].attributes.name, j.data[0].id);
            else console.log("RECORD_MISSING");
          })().catch(e => { console.error(e.message); process.exit(1); });
          '
