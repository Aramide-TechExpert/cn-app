name: Flutter CI

# Flutter runs entirely in CI — subosito/flutter-action pulls the SDK from git,
# so no local SDK is needed (matches the embedded-finance approach). On every
# push to main: analyze + test + build per-ABI debug APKs, capture diagnostics
# as artifacts, and publish the APKs to a rolling `flutter-latest` Release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Platform folders aren't committed; generate them so pub get resolves.
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get

      # Capture each step's output to a file so it's readable as an artifact
      # regardless of log retention. continue-on-error so all steps run + report.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.txt

      - name: Test
        continue-on-error: true
        run: flutter test 2>&1 | tee test.txt

      - name: Build debug APK (per-ABI = smaller downloads)
        continue-on-error: true
        run: |
          flutter build apk --debug --split-per-abi \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE=${{ secrets.API_BASE || 'https://clustez.vercel.app/api/v1' }} \
            2>&1 | tee build.txt

      - name: Upload diagnostics (analyze/test/build logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            analyze.txt
            test.txt
            build.txt

      - name: Upload APKs (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: ignore

      # Publish to a rolling Release so there's always a current download link.
      - name: Publish APK to rolling Release
        if: github.ref == 'refs/heads/main' && hashFiles('build/app/outputs/flutter-apk/*-debug.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-latest
          name: Clustez — Flutter APK (latest)
          body: |
            Auto-built debug APKs from `main` (per-architecture for smaller downloads).
            Most phones: **app-arm64-v8a-debug.apk** (~50MB). Older 32-bit devices:
            app-armeabi-v7a-debug.apk. Emulators: app-x86_64-debug.apk.
          files: build/app/outputs/flutter-apk/*-debug.apk

      # Gate: fail only on real analyze ERRORS (not info/warning lints) or a
      # missing APK — so info-level nits don't block the build.
      - name: Gate
        run: |
          if grep -q "error •" analyze.txt; then
            echo "::error::flutter analyze reported errors:"; grep "error •" analyze.txt; exit 1
          fi
          if ! ls build/app/outputs/flutter-apk/*-debug.apk >/dev/null 2>&1; then
            echo "::error::APK was not produced — see build.txt"; exit 1
          fi
          echo "Analyze clean (errors). APK built. Info-level lints (if any) are non-blocking."
