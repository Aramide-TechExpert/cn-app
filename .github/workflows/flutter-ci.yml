name: Flutter CI

# Flutter runs entirely in CI — subosito/flutter-action pulls the SDK from git,
# so no local SDK is needed (matches the embedded-finance approach).
# Every push: analyze + test (~2-3 min). The expensive ~9-min APK build runs
# ONLY on a manual run or a commit message containing [apk], then publishes to
# the rolling `flutter-latest` Release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# Cancel a superseded run when iterating quickly on the same ref.
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Platform folders aren't committed; generate them so pub get resolves.
      # --org sets a real package id (app.clustez.clustez), distinct from the
      # RN app (app.clustez.mobile) so both can coexist on a device.
      - run: flutter create --platforms=android,ios --org app.clustez .
      - run: flutter pub get

      # ── Cheap validation on EVERY push ──────────────────────────────────────
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.txt

      - name: Test
        continue-on-error: true
        run: flutter test 2>&1 | tee test.txt

      # ── Expensive APK build only on demand ([apk] in commit msg, or manual) ──
      - name: Build debug APK (per-ABI = smaller downloads)
        id: build
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
        continue-on-error: true
        run: |
          flutter build apk --debug --split-per-abi \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE=${{ secrets.API_BASE || 'https://clustez.vercel.app/api/v1' }} \
            2>&1 | tee build.txt

      - name: Upload diagnostics (analyze/test/build logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            analyze.txt
            test.txt
            build.txt
          if-no-files-found: ignore

      - name: Upload APKs (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: ignore

      # Rolling Release on THIS (private) repo — for the team.
      - name: Publish APK to rolling Release (private)
        if: steps.build.outcome == 'success' && hashFiles('build/app/outputs/flutter-apk/*-debug.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-latest
          name: Clustez — Flutter APK (latest)
          body: |
            Auto-built debug APKs (per-architecture for smaller downloads).
            Most phones: **app-arm64-v8a-debug.apk**. Older 32-bit devices:
            app-armeabi-v7a-debug.apk. Emulators: app-x86_64-debug.apk.
          files: build/app/outputs/flutter-apk/*-debug.apk

      # Mirror to the PUBLIC dist repo so testers can download without a login.
      - name: Publish APK to public dist
        if: steps.build.outcome == 'success' && hashFiles('build/app/outputs/flutter-apk/*-debug.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: Aramide-TechExpert/clustez-flutter-dist
          token: ${{ secrets.DIST_TOKEN }}
          tag_name: flutter-latest
          name: Clustez — Flutter APK (latest)
          body: |
            Public Android downloads. Most phones: **app-arm64-v8a-debug.apk**.
            Older 32-bit: app-armeabi-v7a-debug.apk. Emulators: app-x86_64-debug.apk.
          files: build/app/outputs/flutter-apk/*-debug.apk

      # Gate: analyze errors + test failures fail EVERY run; a missing APK only
      # fails runs that actually attempted a build. Info/warning lints don't block.
      - name: Gate
        run: |
          fail=0
          if grep -q "error •" analyze.txt; then
            echo "::error::flutter analyze reported errors:"; grep "error •" analyze.txt; fail=1
          fi
          if grep -qiE "Some tests failed|[1-9][0-9]* failed" test.txt; then
            echo "::error::test failures — see diagnostics"; fail=1
          fi
          if [ "${{ steps.build.outcome }}" != "skipped" ] && ! ls build/app/outputs/flutter-apk/*-debug.apk >/dev/null 2>&1; then
            echo "::error::APK build was requested but produced nothing — see build.txt"; fail=1
          fi
          [ "$fail" = "0" ] && echo "OK: analyze clean + tests pass."
          exit $fail
