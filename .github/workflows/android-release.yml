name: Android Release APK

# Builds a standalone release APK in the cloud and publishes it as a GitHub
# Release asset — so no local 80-min build is needed. Trigger by pushing a
# version tag (`git tag v1.0.0 && git push --tags`) or run it manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native android project
        run: flutter create --platforms=android --org app.clustez --project-name clustez .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Run tests (non-blocking)
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE=${{ secrets.API_BASE || 'https://clustez.vercel.app/api/v1' }}

      - name: Name the artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk clustez-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Clustez ${{ github.ref_name }}
          files: clustez-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Upload APK artifact (for manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: clustez-apk
          path: build/app/outputs/flutter-apk/app-release.apk
