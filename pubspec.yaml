name: clustez
description: "Clustez — native mobile news intelligence (Flutter/Dart)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Navigation (5-tab shell + detail routes)
  go_router: ^14.2.7
  # Auth + direct RLS data (channel 1 of the hybrid backend)
  supabase_flutter: ^2.6.0
  # /api/v1 client (channel 2)
  dio: ^5.7.0
  # Images with caching + monogram fallback
  cached_network_image: ^3.4.1
  # Link-out in-app browser
  url_launcher: ^6.3.1
  # Native OS share sheet (article actions)
  share_plus: ^10.1.2
  # Swipe actions on cards (Saved: swipe-to-remove)
  flutter_slidable: ^3.1.1
  # Local reading history ("Continue reading")
  shared_preferences: ^2.3.3
  # Inline video — official webview loads a YouTube nocookie embed URL
  # (avoids flutter_inappwebview's Gradle break + the iframe player runtime
  # error). Falls back to poster + link-out for non-YouTube / load failures.
  webview_flutter: ^4.10.0
  # Inline playback of self-hosted videos (article.videoUrl from ingest:
  # mp4/m3u8 — never YouTube/Vimeo). Pinned for the Xcode 15.2 / iOS-17 SDK
  # toolchain (avoids avfoundation impls that call iOS-18-only symbols).
  video_player: ^2.8.7
  # Detect when a video card scrolls into view → muted autoplay (pure Dart).
  visibility_detector: ^0.4.0+2

dependency_overrides:
  # Xcode 15.2 (iOS 17 SDK) can't compile device_info_plus 12.x's
  # NSProcessInfo.isiOSAppOnVision (iOS 18 SDK symbol). Pin pre-visionOS.
  device_info_plus: 9.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
